# UPS-Watchdog wake-up plug for NOUS A1T (ESP8285)
# Sends Wake-on-LAN to the NAS for ~10 minutes after it gets mains power.
# Replace nas_mac with the MAC of YOUR NAS (the LAN port with WOL enabled;
# the UPS-Watchdog app shows it in setup step 5).
substitutions:
  nas_mac: "AA:BB:CC:DD:EE:FF"

esphome:
  name: ups-wake
  comment: "UPS-Watchdog: Wake-on-LAN after mains returns"
  on_boot:
    priority: -100
    then:
      - wait_until:
          condition: wifi.connected
          timeout: 5min
      - delay: 30s
      - repeat:
          count: 20
          then:
            - button.press: wol_nas
            - delay: 30s

esp8266:
  board: esp8285
  restore_from_flash: true
  early_pin_init: false

logger:

wifi:
  ap:
    ssid: "UPS-Wake-Setup"
    password: "change-me"   # setup network password - change before building

captive_portal:

web_server:
  port: 80

ota:
  - platform: esphome

button:
  - platform: wake_on_lan
    id: wol_nas
    name: "Wake NAS"
    target_mac_address: ${nas_mac}

switch:
  - platform: gpio
    pin: GPIO14
    id: relay
    name: "Relay"
    restore_mode: ALWAYS_OFF

status_led:
  pin:
    number: GPIO13
    inverted: true
